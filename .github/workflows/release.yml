name: Auto Release on CHANGELOG Update

on:
  push:
    branches: [main]
    paths:
      - 'CHANGELOG.md'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v2026.05.12). Leave empty to derive from CHANGELOG date.'
        required: false
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse latest CHANGELOG section
        id: parse
        run: |
          set -euo pipefail
          # Extracts the first '## [...] — YYYY-MM-DD' block from CHANGELOG.md
          BODY=$(awk '
            /^## \[.*\] — [0-9]{4}-[0-9]{2}-[0-9]{2}/ {
              if (found) exit
              found=1
              header=$0
              print
              next
            }
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md)

          if [ -z "$BODY" ]; then
            echo "No dated changelog section found — skipping release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          HEADER=$(echo "$BODY" | head -n 1)
          DATE=$(echo "$HEADER" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -n1)
          LABEL=$(echo "$HEADER" | sed -nE 's/^## \[([^]]+)\].*/\1/p')

          # Resolve tag
          INPUT_VERSION="${{ inputs.version }}"
          if [ -n "$INPUT_VERSION" ]; then
            BASE_TAG="$INPUT_VERSION"
          elif [ "$LABEL" = "Unreleased" ]; then
            BASE_TAG="v${DATE//-/.}"
          else
            BASE_TAG="$LABEL"
            [[ "$BASE_TAG" != v* ]] && BASE_TAG="v$BASE_TAG"
          fi

          TAG="$BASE_TAG"
          COUNTER=1
          while git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; do
            COUNTER=$((COUNTER+1))
            TAG="${BASE_TAG}-r${COUNTER}"
          done

          echo "tag=$TAG"   >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          {
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build install bundle
        if: steps.parse.outputs.skip != 'true'
        run: |
          set -euo pipefail
          BUNDLE="my-brain-is-full-crew-${{ steps.parse.outputs.tag }}.tar.gz"
          tar -czf "$BUNDLE" \
            agents \
            references \
            scripts \
            adapters \
            mcp \
            docs \
            README.md \
            CHANGELOG.md \
            CONTRIBUTING.md \
            LICENSE 2>/dev/null || true
          ls -lh "$BUNDLE"
          echo "BUNDLE=$BUNDLE" >> "$GITHUB_ENV"

      - name: Create release
        if: steps.parse.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.parse.outputs.tag }}
          name: "${{ steps.parse.outputs.tag }} — ${{ steps.parse.outputs.date }}"
          body: ${{ steps.parse.outputs.body }}
          files: ${{ env.BUNDLE }}
          make_latest: 'true'
